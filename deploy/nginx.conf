server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Flet использует пути вида /quests, /habits — отдаём index.html для них.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|wasm|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;
}
